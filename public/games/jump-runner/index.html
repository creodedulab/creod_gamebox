<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점프 러너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        .retro-shadow {
            text-shadow: 3px 3px 0px rgba(0,0,0,0.8);
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .animate-glow {
            animation: pulseGlow 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center overflow-hidden p-2 sm:p-4">

    <div id="app" class="w-full max-w-3xl flex flex-col items-center">
        
        <!-- Header / Stats Bar -->
        <header class="w-full bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl p-4 mb-3 flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600/20 p-2.5 rounded-xl border border-indigo-500/30 text-indigo-400">
                    <i class="fa-solid fa-person-running text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-1.5">
                        점프 러너 <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/30">v2.5</span>
                    </h1>
                    <div class="text-xs text-slate-400 flex items-center gap-2">
                        <span>최고 기록: <strong id="highScoreDisplay" class="text-amber-400">00000</strong></span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Coin Counter -->
                <div class="flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-xl">
                    <i class="fa-solid fa-coins text-amber-400 text-sm"></i>
                    <span id="coinDisplay" class="font-bold text-amber-300 text-sm">0</span>
                </div>
                <!-- Shop Button -->
                <button onclick="openShop()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-store text-indigo-400"></i> 상점
                </button>
            </div>
        </header>

        <!-- Game Canvas Container -->
        <div class="relative w-full aspect-[2/1] bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
            
            <!-- Canvas -->
            <canvas id="gameCanvas" class="w-full h-full"></canvas>

            <!-- Active Status Overlay inside canvas area -->
            <div id="statusOverlay" class="absolute top-3 left-3 flex gap-2 pointer-events-none"></div>

            <!-- Start Menu Overlay -->
            <div id="startMenu" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center text-center p-6 transition-opacity duration-300">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-3xl flex items-center justify-center text-3xl mb-3 shadow-lg shadow-indigo-500/30 animate-glow">
                    <i class="fa-solid fa-person-running text-white"></i>
                </div>
                <h2 class="text-3xl sm:text-4xl font-extrabold text-white mb-2 retro-shadow">점프 러너</h2>
                <p class="text-xs sm:text-sm text-slate-400 mb-6 max-w-xs">장애물을 피하고 아이템과 코인을 모아 질주하세요!</p>
                <button onclick="startGame()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-indigo-600/40 transition transform hover:scale-105 active:scale-95 text-base flex items-center gap-2">
                    <i class="fa-solid fa-play"></i> 게임 시작
                </button>
                <div class="mt-4 text-[11px] text-slate-500 flex gap-4">
                    <span>점프: [Space] / [↑] / [터치]</span>
                    <span>숙이기: [↓] / [버튼]</span>
                </div>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameOverMenu" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center text-center p-6 hidden">
                <div class="w-14 h-14 bg-rose-500/20 text-rose-400 border border-rose-500/40 rounded-2xl flex items-center justify-center text-2xl mb-3">
                    <i class="fa-solid fa-skull"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-1">게임 오버</h2>
                <div class="bg-slate-900 border border-slate-800 rounded-xl px-5 py-3 my-3 w-48 shadow-inner">
                    <div class="text-xs text-slate-400">획득 점수</div>
                    <div id="finalScore" class="text-2xl font-bold text-indigo-400">00000</div>
                </div>
                <button onclick="startGame()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition transform hover:scale-105 active:scale-95 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 다시 도전
                </button>
            </div>

            <!-- Mobile Controller Buttons inside canvas view bottom corners -->
            <div class="absolute bottom-3 left-3 flex gap-2 sm:hidden pointer-events-auto">
                <button id="btnDuck" class="bg-slate-800/80 hover:bg-slate-700 active:bg-slate-600 text-white border border-slate-700 w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg text-lg">
                    <i class="fa-solid fa-arrow-down"></i>
                </button>
            </div>
            <div class="absolute bottom-3 right-3 sm:hidden pointer-events-auto">
                <button id="btnJump" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-600/40 text-xl">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shopModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xl rounded-3xl p-5 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                <div class="flex items-center gap-2.5">
                    <div class="bg-indigo-600/20 text-indigo-400 p-2 rounded-xl">
                        <i class="fa-solid fa-store text-lg"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-base text-slate-100">점프 러너 상점</h3>
                        <p class="text-xs text-slate-400">캐릭터, 테마 및 트레일 효과 변경</p>
                    </div>
                </div>
                <button onclick="closeShop()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-xl flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Tab Content -->
            <div class="flex-1 overflow-y-auto py-4 space-y-5 pr-1">
                <!-- Color Palette Section -->
                <div>
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-palette text-indigo-400"></i> 캐릭터 색상 선택 (무료)
                    </h4>
                    <div id="colorPalette" class="flex flex-wrap gap-2.5"></div>
                </div>

                <!-- Character Selection Section -->
                <div>
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-masks-theater text-indigo-400"></i> 캐릭터 변경 (모두 무료)
                    </h4>
                    <div id="characterList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                </div>

                <!-- Trail Effect Shop Section -->
                <div>
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-wind text-amber-400"></i> 트레일 효과 상점
                    </h4>
                    <div id="trailList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                </div>

                <!-- Background Theme Section -->
                <div>
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                        <i class="fa-solid fa-image text-purple-400"></i> 배경 테마 선택
                    </h4>
                    <div id="themeList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800 flex justify-end">
                <button onclick="closeShop()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Sound Synthesizer
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playJump() { this.playTone(320, 'square', 0.15, 0.08); }
            playDoubleJump() { this.playTone(480, 'square', 0.15, 0.08); }
            playCoin() { 
                this.playTone(600, 'sine', 0.1, 0.1);
                setTimeout(() => this.playTone(900, 'sine', 0.15, 0.1), 80);
            }
            playPowerup() {
                this.playTone(400, 'triangle', 0.1, 0.1);
                setTimeout(() => this.playTone(700, 'triangle', 0.2, 0.1), 100);
            }
            playSlash() {
                this.playTone(220, 'sawtooth', 0.12, 0.1);
            }
            playHit() { this.playTone(120, 'sawtooth', 0.3, 0.15); }
        }

        const sound = new SoundEngine();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 400;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const GROUND_Y = 320;

        const CHARACTERS = [
            { id: 'dino', name: '공룡', icon: '<i class="fa-solid fa-dragon"></i>' },
            { id: 'ufo', name: 'UFO', icon: '<i class="fa-solid fa-saucer"></i>' },
            { id: 'fox', name: '여우', icon: '<i class="fa-solid fa-paw"></i>' },
            { id: 'cat', name: '고양이', icon: '<i class="fa-solid fa-cat"></i>' },
            { id: 'dog', name: '강아지', icon: '<i class="fa-solid fa-dog"></i>' },
            { id: 'rabbit', name: '토끼', icon: '<i class="fa-solid fa-rabbit"></i>' },
            { id: 'robot', name: '로봇', icon: '<i class="fa-solid fa-robot"></i>' },
            { id: 'dragon', name: '드래곤', icon: '<i class="fa-solid fa-fire"></i>' },
            { id: 'bear', name: '곰', icon: '<i class="fa-solid fa-paw"></i>' },
            { id: 'penguin', name: '펭귄', icon: '<i class="fa-solid fa-dove"></i>' }
        ];

        const COLOR_OPTIONS = ['#10b981', '#3b82f6', '#f43f5e', '#eab308', '#a855f7', '#06b6d4', '#f97316', '#ffffff'];

        const THEMES = [
            { id: 'desert', name: '심야 크루즈', bg: '#090d16', ground: '#1e293b', accent: '#38bdf8' },
            { id: 'synthwave', name: '네온 신스웨이브', bg: '#181825', ground: '#2b1055', accent: '#f43f5e' },
            { id: 'galaxy', name: '미드나잇 갤럭시', bg: '#030712', ground: '#1f2937', accent: '#a855f7' }
        ];

        const TRAILS = [
            { id: 'none', name: '트레일 없음', color: null, price: 0 },
            { id: 'red', name: '빨강색 트레일', color: '#ef4444', price: 5 },
            { id: 'orange', name: '주황색 트레일', color: '#f97316', price: 10 },
            { id: 'yellow', name: '노랑색 트레일', color: '#eab308', price: 15 },
            { id: 'green', name: '초록색 트레일', color: '#10b981', price: 20 },
            { id: 'blue', name: '파랑색 트레일', color: '#3b82f6', price: 25 },
            { id: 'purple', name: '보라색 트레일', color: '#a855f7', price: 30 },
            { id: 'white', name: '흰색 트레일', color: '#ffffff', price: 35 }
        ];

        let gameState = 'MENU';
        let coins = parseInt(localStorage.getItem('runner_coins') || '0', 10);
        let highScore = parseInt(localStorage.getItem('runner_highscore') || '0', 10);
        let activeChar = localStorage.getItem('runner_char') || 'dino';
        let activeCharColor = localStorage.getItem('runner_char_color') || '#10b981';
        let activeTheme = localStorage.getItem('runner_theme') || 'desert';
        let activeTrail = localStorage.getItem('runner_trail') || 'none';
        let unlockedTrails = JSON.parse(localStorage.getItem('runner_unlocked_trails') || '["none"]');

        let score = 0;
        let distance = 0;
        let speed = 5;
        let baseSpeed = 5;
        let maxSpeed = 11;
        let frameCount = 0;

        let obstacles = [];
        let coinsList = [];
        let powerups = [];
        let particles = [];
        let bgStars = [];
        let trailHistory = [];

        // Player object with nickname "점프 러너"
        let runner = {
            x: 80,
            y: GROUND_Y - 40,
            width: 40,
            height: 40,
            normalHeight: 40,
            duckHeight: 25,
            vy: 0,
            gravity: 0.8,
            jumpForce: -13.5,
            isGrounded: true,
            isDucking: false,
            animFrame: 0,
            // Buffs
            shield: 0, // 0: none, 1: normal shield, 2: iron armor (2 hits)
            doubleJumpUnlocked: false,
            canDoubleJump: false,
            swordTimer: 0,
            speedEffect: 'normal', // 'normal', 'slow', 'fast'
            speedEffectTimer: 0
        };

        for (let i = 0; i < 40; i++) {
            bgStars.push({
                x: Math.random() * CANVAS_WIDTH,
                y: Math.random() * (GROUND_Y - 70),
                size: Math.random() * 2 + 1,
                alpha: Math.random()
            });
        }

        document.getElementById('highScoreDisplay').innerText = String(highScore).padStart(5, '0');
        document.getElementById('coinDisplay').innerText = coins;

        function startGame() {
            sound.init();
            gameState = 'PLAYING';
            score = 0;
            distance = 0;
            speed = 5;
            frameCount = 0;
            obstacles = [];
            coinsList = [];
            powerups = [];
            particles = [];
            trailHistory = [];
            
            runner.y = GROUND_Y - runner.normalHeight;
            runner.vy = 0;
            runner.shield = 0;
            runner.doubleJumpUnlocked = false;
            runner.swordTimer = 0;
            runner.speedEffect = 'normal';
            runner.speedEffectTimer = 0;

            document.getElementById('startMenu').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('gameOverMenu').classList.add('hidden');
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            sound.playHit();
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('runner_highscore', highScore);
                document.getElementById('highScoreDisplay').innerText = String(highScore).padStart(5, '0');
            }
            document.getElementById('finalScore').innerText = String(score).padStart(5, '0');
            document.getElementById('gameOverMenu').classList.remove('hidden');
        }

        function spawnObstacles() {
            // Reduced cactus count & increased spacing
            const minSpawnInterval = 110; 
            if (frameCount % minSpawnInterval === 0 && Math.random() < 0.8) {
                const typeRand = Math.random();
                if (typeRand < 0.65) {
                    // Cactus (Single or Pair)
                    const isDouble = Math.random() < 0.3;
                    obstacles.push({
                        type: 'cactus',
                        x: CANVAS_WIDTH + 50,
                        y: GROUND_Y - 40,
                        width: isDouble ? 55 : 30,
                        height: 40,
                        isDouble: isDouble
                    });
                } else {
                    // Pterodactyl (Flying)
                    const heights = [GROUND_Y - 35, GROUND_Y - 75, GROUND_Y - 110];
                    const pHeight = heights[Math.floor(Math.random() * heights.length)];
                    obstacles.push({
                        type: 'bird',
                        x: CANVAS_WIDTH + 50,
                        y: pHeight,
                        width: 40,
                        height: 30,
                        anim: 0
                    });
                }
            }
        }

        function spawnItems() {
            // Spawn Coins and Powerups
            if (frameCount % 130 === 0) {
                coinsList.push({
                    x: CANVAS_WIDTH + 40,
                    y: GROUND_Y - 70 - Math.random() * 60,
                    radius: 10
                });
            }

            if (frameCount % 380 === 0) {
                // Powerup types: purple (double jump), red (slow), blue (fast), yellow (random box)
                const types = ['purple', 'red', 'blue', 'yellow'];
                const pType = types[Math.floor(Math.random() * types.length)];
                powerups.push({
                    x: CANVAS_WIDTH + 40,
                    y: GROUND_Y - 90,
                    width: 30,
                    height: 30,
                    type: pType
                });
            }
        }

        function updatePlayer() {
            // Speed effect modifiers
            let currentSpeedMod = speed;
            if (runner.speedEffect === 'slow') currentSpeedMod = speed * 0.75;
            if (runner.speedEffect === 'fast') currentSpeedMod = speed * 1.35;

            runner.vy += runner.gravity;
            runner.y += runner.vy;

            const currentH = runner.isDucking ? runner.duckHeight : runner.normalHeight;
            if (runner.y + currentH >= GROUND_Y) {
                runner.y = GROUND_Y - currentH;
                runner.vy = 0;
                runner.isGrounded = true;
                runner.canDoubleJump = runner.doubleJumpUnlocked;
            }

            if (runner.swordTimer > 0) runner.swordTimer--;
            if (runner.speedEffectTimer > 0) {
                runner.speedEffectTimer--;
                if (runner.speedEffectTimer === 0) runner.speedEffect = 'normal';
            }

            if (frameCount % 6 === 0) {
                runner.animFrame = (runner.animFrame + 1) % 2;
            }

            // Trail updates
            if (activeTrail !== 'none' && frameCount % 2 === 0) {
                trailHistory.push({
                    x: runner.x + runner.width / 2,
                    y: runner.y + runner.height / 2,
                    alpha: 0.8
                });
                if (trailHistory.length > 15) trailHistory.shift();
            }
        }

        function checkCollisions() {
            const rx = runner.x + 6;
            const ry = runner.y + 4;
            const rw = runner.width - 12;
            const rh = (runner.isDucking ? runner.duckHeight : runner.normalHeight) - 8;

            // Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                let ox = obs.x + 4;
                let oy = obs.y + 4;
                let ow = obs.width - 8;
                let oh = obs.height - 8;

                if (rx < ox + ow && rx + rw > ox && ry < oy + oh && ry + rh > oy) {
                    // Check sword slash powerup
                    if (runner.swordTimer > 0) {
                        obstacles.splice(i, 1);
                        sound.playSlash();
                        createParticles(obs.x, obs.y, '#f59e0b', 10);
                        continue;
                    }

                    // Check Shield / Armor
                    if (runner.shield > 0) {
                        runner.shield--;
                        obstacles.splice(i, 1);
                        sound.playHit();
                        createParticles(rx, ry, '#38bdf8', 15);
                        updateStatusOverlay();
                        continue;
                    }

                    gameOver();
                    return;
                }
            }

            // Coins
            for (let i = coinsList.length - 1; i >= 0; i--) {
                let c = coinsList[i];
                let dx = (runner.x + runner.width/2) - c.x;
                let dy = (runner.y + runner.height/2) - c.y;
                if (Math.hypot(dx, dy) < c.radius + 18) {
                    coins++;
                    document.getElementById('coinDisplay').innerText = coins;
                    localStorage.setItem('runner_coins', coins);
                    coinsList.splice(i, 1);
                    sound.playCoin();
                    createParticles(c.x, c.y, '#eab308', 8);
                }
            }

            // Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                if (rx < p.x + p.width && rx + rw > p.x && ry < p.y + p.height && ry + rh > p.y) {
                    applyPowerup(p.type);
                    powerups.splice(i, 1);
                    sound.playPowerup();
                    createParticles(p.x, p.y, '#a855f7', 12);
                }
            }
        }

        function applyPowerup(type) {
            if (type === 'purple') {
                // Double Jump
                runner.doubleJumpUnlocked = true;
                runner.canDoubleJump = true;
            } else if (type === 'red') {
                // Slow speed
                runner.speedEffect = 'slow';
                runner.speedEffectTimer = 350;
            } else if (type === 'blue') {
                // Fast speed
                runner.speedEffect = 'fast';
                runner.speedEffectTimer = 300;
            } else if (type === 'yellow') {
                // Random Box: Shield, Sword, or Iron Armor
                const rand = Math.random();
                if (rand < 0.33) {
                    runner.shield = 1; // Shield
                } else if (rand < 0.66) {
                    runner.swordTimer = 400; // Sword slash active
                } else {
                    runner.shield = 2; // Iron armor (2 hits)
                }
            }
            updateStatusOverlay();
        }

        function updateStatusOverlay() {
            const overlay = document.getElementById('statusOverlay');
            let html = '';
            if (runner.doubleJumpUnlocked) html += `<span class="bg-purple-500/20 text-purple-300 border border-purple-500/40 text-[10px] px-2 py-0.5 rounded-md font-bold">2단점프 활성</span>`;
            if (runner.shield === 1) html += `<span class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 text-[10px] px-2 py-0.5 rounded-md font-bold">방패 보호막</span>`;
            if (runner.shield === 2) html += `<span class="bg-slate-500/20 text-slate-200 border border-slate-500/40 text-[10px] px-2 py-0.5 rounded-md font-bold">철옷(2회)</span>`;
            if (runner.swordTimer > 0) html += `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] px-2 py-0.5 rounded-md font-bold">검기 활성</span>`;
            if (runner.speedEffect === 'slow') html += `<span class="bg-rose-500/20 text-rose-300 border border-rose-500/40 text-[10px] px-2 py-0.5 rounded-md font-bold">느리게</span>`;
            if (runner.speedEffect === 'fast') html += `<span class="bg-blue-500/20 text-blue-300 border border-blue-500/40 text-[10px] px-2 py-0.5 rounded-md font-bold">빠르게</span>`;
            overlay.innerHTML = html;
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    color: color,
                    alpha: 1,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles.get ? particles[i] : particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.03;
                if (pt.alpha <= 0) particles.splice(i, 1);
            }
        }

        function drawBackground() {
            const theme = THEMES.find(t => t.id === activeTheme) || THEMES[0];
            
            // Sky background
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Stars
            ctx.fillStyle = '#ffffff';
            bgStars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1.0;

            // Ground
            ctx.fillStyle = theme.ground;
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            // Ground stripe decoration
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            for (let i = 0; i < CANVAS_WIDTH; i += 40) {
                const dotX = (i - (frameCount * speed) % 40 + CANVAS_WIDTH) % CANVAS_WIDTH;
                ctx.fillRect(dotX, GROUND_Y + 12, 16, 3);
            }
        }

        function drawTrails() {
            if (activeTrail === 'none') return;
            const trailObj = TRAILS.find(t => t.id === activeTrail);
            if (!trailObj || !trailObj.color) return;

            trailHistory.forEach((pt, idx) => {
                pt.x -= speed;
                pt.alpha -= 0.05;
                if (pt.alpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = Math.max(0, pt.alpha);
                ctx.fillStyle = trailObj.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 8 * (idx / trailHistory.length), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            trailHistory = trailHistory.filter(pt => pt.alpha > 0);
        }

        function drawRunnerCharacter() {
            ctx.save();
            ctx.translate(runner.x, runner.y);

            const curH = runner.isDucking ? runner.duckHeight : runner.normalHeight;

            // Nickname above character: "점프 러너"
            ctx.font = 'bold 12px "Jua", sans-serif';
            ctx.fillStyle = '#f8fafc';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText('점프 러너', runner.width / 2, -10);
            ctx.shadowBlur = 0;

            const mainColor = activeCharColor;
            const eyeColor = '#0f172a'; // 작은 검정색 눈

            // Helper for small black eye with highlight
            const drawEye = (ex, ey, r = 2.5) => {
                ctx.fillStyle = eyeColor;
                ctx.beginPath();
                ctx.arc(ex, ey, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(ex + 0.8, ey - 0.8, r * 0.35, 0, Math.PI * 2);
                ctx.fill();
            };

            // Smooth & Rounded Character Rendering
            if (activeChar === 'dino') {
                // 유선형 공룡 (T-Rex)
                ctx.fillStyle = mainColor;
                ctx.beginPath();
                ctx.ellipse(runner.width / 2 - 2, curH / 2 + 4, 14, curH / 2 - 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // 부드러운 배 부분
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();

                // 둥근 머리

                // 유선형 꼬리

                ctx.ellipse(runner.width / 2, curH / 2 + 3, 15, curH / 2 - 4, 0, 0, Math.PI * 2);

        function drawObstacles() {
            obstacles.forEach(obs => {
                if (obs.type === 'cactus') {
                    // 입체감 있는 선인장 표현
                    ctx.fillStyle = '#15803d'; // 그림자 어두운 초록
                    ctx.fillRect(obs.x + 2, obs.y, obs.width - 4, obs.height);
                    ctx.fillStyle = '#22c55e'; // 메인 초록
                    ctx.fillRect(obs.x + 4, obs.y, obs.width - 8, obs.height);

                    // 선인장 가시 디테일
                    ctx.fillStyle = '#86efac';
                    for (let cy = obs.y + 8; cy < obs.y + obs.height - 5; cy += 10) {
                        ctx.fillRect(obs.x + 1, cy, 3, 2);
                        ctx.fillRect(obs.x + obs.width - 4, cy + 4, 3, 2);
                    }

                    // 선인장 가지 (듀얼인 경우)
                    if (obs.isDouble) {
                        ctx.fillStyle = '#15803d';
                        ctx.fillRect(obs.x - 8, obs.y + 12, 10, 6);
                        ctx.fillRect(obs.x - 8, obs.y + 6, 4, 10);
                        ctx.fillStyle = '#22c55e';
                        ctx.fillRect(obs.x - 6, obs.y + 13, 8, 4);
                        ctx.fillRect(obs.x - 6, obs.y + 8, 2, 7);
                    } else {
                        ctx.fillStyle = '#15803d';
                        ctx.fillRect(obs.x + obs.width - 2, obs.y + 16, 10, 6);
                        ctx.fillRect(obs.x + obs.width + 4, obs.y + 10, 4, 10);
                        ctx.fillStyle = '#22c55e';
                        ctx.fillRect(obs.x + obs.width, obs.y + 17, 8, 4);
                        ctx.fillRect(obs.x + obs.width + 5, obs.y + 11, 2, 7);
                    }
                } else {
                    // 디테일한 익룡(버드) 표현
                    ctx.fillStyle = '#9333ea'; // 보라빛 몸통
                    ctx.fillRect(obs.x + 10, obs.y + 10, obs.width - 16, 12);
                    // 머리 및 부리
                    ctx.fillStyle = '#c084fc';
                    ctx.fillRect(obs.x + (obs.width - 12), obs.y + 6, 12, 8);
                    ctx.fillStyle = '#f59e0b'; // 노란 부리
                    ctx.fillRect(obs.x + obs.width, obs.y + 8, 6, 4);

                    // 날개 애니메이션
                    ctx.fillStyle = '#a855f7';
                    obs.anim = (obs.anim + 0.25) % (Math.PI * 2);
                    let wingOffset = Math.sin(obs.anim) * 12;
                    
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 14, obs.y + 12);
                    ctx.lineTo(obs.x + 22, obs.y + 12 + wingOffset);
                    ctx.lineTo(obs.x + 30, obs.y + 12);
                    ctx.fill();
                }
            });
        }

        function drawItems() {
            // Coins
            coinsList.forEach(c => {
                ctx.fillStyle = '#eab308';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius - 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Powerups
            powerups.forEach(p => {
                if (p.type === 'purple') ctx.fillStyle = '#a855f7';
                else if (p.type === 'red') ctx.fillStyle = '#ef4444';
                else if (p.type === 'blue') ctx.fillStyle = '#3b82f6';
                else ctx.fillStyle = '#eab308'; // yellow '?' box

                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px "Jua", sans-serif';
                ctx.textAlign = 'center';
                let label = '?';
                if (p.type === 'purple') label = '2J';
                if (p.type === 'red') label = 'SL';
                if (p.type === 'blue') label = 'FS';
                ctx.fillText(label, p.x + p.width/2, p.y + 21);
            });
        }

        function drawParticles() {
            particles.forEach(pt => {
                ctx.save();
                ctx.globalAlpha = pt.alpha;
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
                ctx.restore();
            });
        }

        function gameLoop() {
            if (gameState === 'PLAYING') {
                frameCount++;
                distance++;
                score = Math.floor(distance / 5);

                let currentMaxSpeed = maxSpeed;
                if (runner.speedEffect === 'slow') currentMaxSpeed = 7;
                if (runner.speedEffect === 'fast') currentMaxSpeed = 14;

                if (speed < currentMaxSpeed) {
                    speed = baseSpeed + (score / 350);
                }

                runner.updatePlayer = updatePlayer;
                runner.updatePlayer();

                obstacles.forEach(obs => obs.x -= speed);
                obstacles = obstacles.filter(obs => obs.x + obs.width > -50);

                coinsList.forEach(c => c.x -= speed);
                coinsList = coinsList.filter(c => c.x > -20);

                powerups.forEach(p => p.x -= speed);
                powerups = powerups.filter(p => p.x > -30);

                spawnObstacles();
                spawnItems();

                checkCollisions();
                updateParticles();

                document.getElementById('scoreDisplay')?.innerText ? null : null; // managed elsewhere
            }

            drawBackground();
            drawTrails();
            drawObstacles();
            drawItems();
            drawRunnerCharacter();
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        function jumpAction() {
            if (gameState !== 'PLAYING') return;
            sound.init();

            if (runner.isGrounded) {
                runner.vy = runner.jumpForce;
                runner.isGrounded = false;
                runner.isDucking = false;
                sound.playJump();
                createParticles(runner.x + runner.width/2, GROUND_Y, '#38bdf8', 6);
            } else if (runner.doubleJumpUnlocked && runner.canDoubleJump) {
                runner.vy = runner.jumpForce * 0.9;
                runner.canDoubleJump = false;
                sound.playDoubleJump();
                createParticles(runner.x + runner.width/2, runner.y + runner.height, '#a855f7', 10);
            }
        }

        function duckAction(isDown) {
            if (gameState !== 'PLAYING') return;
            if (isDown && runner.isGrounded) {
                runner.isDucking = true;
            } else {
                runner.isDucking = false;
            }
        }

        // Input bindings
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                jumpAction();
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                duckAction(true);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') {
                duckAction(false);
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jumpAction();
        });

        const btnJump = document.getElementById('btnJump');
        const btnDuck = document.getElementById('btnDuck');
        if (btnJump) {
            btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jumpAction(); });
            btnJump.addEventListener('click', () => jumpAction());
        }
        if (btnDuck) {
            btnDuck.addEventListener('touchstart', (e) => { e.preventDefault(); duckAction(true); });
            btnDuck.addEventListener('touchend', (e) => { e.preventDefault(); duckAction(false); });
            btnDuck.addEventListener('mousedown', () => duckAction(true));
            btnDuck.addEventListener('mouseup', () => duckAction(false));
        }

        function openShop() {
            renderShop();
            document.getElementById('shopModal').classList.remove('hidden');
        }

        function closeShop() {
            document.getElementById('shopModal').classList.add('hidden');
        }

        function renderShop() {
            // Colors
            const paletteEl = document.getElementById('colorPalette');
            paletteEl.innerHTML = COLOR_OPTIONS.map(col => `
                <button onclick="selectColor('${col}')" 
                        class="w-8 h-8 rounded-full border-2 ${activeCharColor === col ? 'border-amber-400 scale-110 shadow-lg' : 'border-slate-700'} transition hover:scale-105" 
                        style="background-color:${col}">
                </button>
            `).join('');

            // Characters (All free)
            const charListEl = document.getElementById('characterList');
            charListEl.innerHTML = CHARACTERS.map(ch => {
                const isSelected = activeChar === ch.id;
                const actionBtn = isSelected 
                    ? '<span class="text-xs text-indigo-400 font-bold px-2.5 py-1 bg-indigo-400/10 rounded-lg">선택됨</span>' 
                    : `<button onclick="selectCharacter('${ch.id}')" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-lg transition">선택</button>`;

                return `
                    <div class="bg-slate-800/90 border ${isSelected ? 'border-indigo-400 bg-indigo-500/10' : 'border-slate-700'} p-3 rounded-xl flex justify-between items-center">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center text-lg bg-slate-700 text-indigo-300">
                                ${ch.icon}
                            </div>
                            <div>
                                <div class="text-xs font-bold text-slate-100">${ch.name}</div>
                                <div class="text-[10px] text-emerald-400 font-semibold">무료 사용 가능</div>
                            </div>
                        </div>
                        ${actionBtn}
                    </div>
                `;
            }).join('');

            // Trails
            const trailListEl = document.getElementById('trailList');
            trailListEl.innerHTML = TRAILS.map(t => {
                const isUnlocked = unlockedTrails.includes(t.id);
                const isEquipped = activeTrail === t.id;

                let btnHtml = '';
                if (isEquipped) {
                    btnHtml = '<span class="text-xs text-amber-400 font-bold px-2.5 py-1 bg-amber-400/10 rounded-lg">장착중</span>';
                } else if (isUnlocked) {
                    btnHtml = `<button onclick="buyOrEquipTrail('${t.id}', ${t.price})" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200">장착</button>`;
                } else {
                    const canBuy = coins >= t.price;
                    btnHtml = `<button onclick="buyOrEquipTrail('${t.id}', ${t.price})" class="text-xs ${canBuy ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-slate-800 text-slate-500 cursor-not-allowed'} font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1"><i class="fa-solid fa-coins"></i> ${t.price}</button>`;
                }

                return `
                    <div class="bg-slate-800/90 border ${isEquipped ? 'border-amber-400 bg-amber-500/10' : 'border-slate-700'} p-3 rounded-xl flex justify-between items-center">
                        <div class="flex items-center gap-2.5">
                            <div class="w-6 h-6 rounded-full border border-slate-600 shadow-inner" style="background-color: ${t.color || '#334155'}"></div>
                            <div>
                                <div class="text-xs font-bold text-slate-100">${t.name}</div>
                                <div class="text-[10px] text-amber-300 font-semibold">${t.price === 0 ? '기본 제공' : `가격: ${t.price} 코인`}</div>
                            </div>
                        </div>
                        ${btnHtml}
                    </div>
                `;
            }).join('');

            // Themes
            const themeListEl = document.getElementById('themeList');
            themeListEl.innerHTML = THEMES.map(theme => {
                const isSelected = activeTheme === theme.id;
                const actionBtn = isSelected 
                    ? '<span class="text-xs text-purple-400 font-bold px-2 py-1 bg-purple-400/10 rounded-lg">적용됨</span>' 
                    : `<button onclick="selectTheme('${theme.id}')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200">적용</button>`;

                return `
                    <div class="bg-slate-800/90 border ${isSelected ? 'border-purple-400 bg-purple-500/10' : 'border-slate-700'} p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <div class="text-xs font-bold text-slate-100">${theme.name}</div>
                        </div>
                        ${actionBtn}
                    </div>
                `;
            }).join('');
        }

        function selectColor(hex) {
            activeCharColor = hex;
            localStorage.setItem('runner_char_color', activeCharColor);
            renderShop();
        }

        function selectCharacter(id) {
            activeChar = id;
            localStorage.setItem('runner_char', activeChar);
            renderShop();
        }

        function selectTheme(id) {
            activeTheme = id;
            localStorage.setItem('runner_theme', activeTheme);
            renderShop();
        }

        function buyOrEquipTrail(id, price) {
            if (unlockedTrails.includes(id)) {
                activeTrail = id;
                localStorage.setItem('runner_trail', activeTrail);
                sound.playPowerup();
            } else {
                if (coins >= price) {
                    coins -= price;
                    document.getElementById('coinDisplay').innerText = coins;
                    localStorage.setItem('runner_coins', coins);

                    unlockedTrails.push(id);
                    localStorage.setItem('runner_unlocked_trails', JSON.stringify(unlockedTrails));

                    activeTrail = id;
                    localStorage.setItem('runner_trail', activeTrail);
                    sound.playCoin();
                } else {
                    sound.playHit();
                }
            }
            renderShop();
        }

        // Start animation loop on load
        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
