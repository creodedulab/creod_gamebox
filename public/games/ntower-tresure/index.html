<!DOCTYPE html>
<html lang="ko">
<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #1e1b18;
            color: #333;
        }

        .font-gaegu {
            font-family: 'Gaegu', cursive;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 4px;
        }

        /* Storyboard Background Patterns */
        .bg-warm-paper {
            background-color: #fdfbf7;
            background-image: radial-gradient(#e5e0d8 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .pulse-glow {
            animation: pulse-glow-anim 2s infinite alternate;
        }

        @keyframes pulse-glow-anim {
            0% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
            100% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.9); }
        }

        .floating {
            animation: floating-anim 3s ease-in-out infinite;
        }

        @keyframes floating-anim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Flashlight Effect Overlay */
        .flashlight-overlay {
            background: radial-gradient(circle 90px at var(--x, 50%) var(--y, 50%), transparent 0%, rgba(10, 10, 15, 0.96) 100%);
        }

        .golden-shimmer {
            background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            background-size: 200% 200%;
            animation: shimmer-anim 3s infinite linear;
        }

        @keyframes shimmer-anim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4 overflow-x-hidden">

    <!-- Main Outer Game Frame -->

        <!-- Header Bar -->
        <header class="h-14 bg-gradient-to-r from-amber-900 via-amber-800 to-amber-900 text-amber-100 px-4 flex items-center justify-between shadow-md z-30 shrink-0">
            <div class="flex items-center gap-3">
                <button id="btn-home" class="p-2 rounded-xl hover:bg-amber-700/50 transition-colors text-amber-200" title="메인 메뉴로">
                    <i class="fa-solid fa-house text-lg"></i>

                <div class="flex flex-col">

                    <span id="stage-subtitle" class="text-xs text-amber-300/80 font-gaegu text-sm">꼬마 탐험가 시우의 모험</span>

            <!-- Top Controls & Inventory Buttons -->
            <div class="flex items-center gap-2">

        <!-- Footer / Dialogue Area -->

                    👦
                </div>
                <div class="flex-1 flex flex-col justify-center">
                    <div id="dialogue-speaker" class="font-bold text-xs sm:text-sm text-amber-900 mb-0.5">시우 (10세 탐험가)</div>
                    <div id="dialogue-text" class="text-xs sm:text-base text-slate-800 leading-snug font-medium line-clamp-2">
                        창밖 남산타워를 볼 때마다 가슴이 뛰어요! 오늘 어떤 보물이 기다리고 있을까요?
                    </div>
                </div>
                <button id="btn-next-step" class="hidden shrink-0 px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-bold text-sm shadow-md transition-all flex items-center gap-1 animate-bounce">
                    <span>다음</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </footer>

        <!-- Custom Modal Window for Journal & Hint -->
        <div id="modal-overlay" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-amber-50 w-full max-w-lg rounded-3xl border-4 border-amber-800/80 shadow-2xl p-5 sm:p-6 relative max-h-[85vh] flex flex-col">
                <button id="btn-close-modal" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-amber-200 text-amber-900 font-bold hover:bg-amber-300 flex items-center justify-center shadow">
                    ✕
                </button>
                <div id="modal-title" class="text-xl sm:text-2xl font-black text-amber-950 mb-3 border-b-2 border-amber-200 pb-2 flex items-center gap-2">
                    <!-- Dynamic Title -->
                </div>
                <div id="modal-body" class="flex-1 overflow-y-auto my-2 text-sm text-slate-700 leading-relaxed pr-1">
                    <!-- Dynamic Content -->
                </div>
                <div class="mt-4 pt-3 border-t border-amber-200 flex justify-end">
                    <button id="btn-modal-ok" class="px-5 py-2 bg-amber-800 text-amber-100 font-bold rounded-xl hover:bg-amber-700">확인</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        /**
         * Sound Synth Engine using Web Audio API
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playBeep(freq = 440, type = 'sine', duration = 0.15, vol = 0.1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            playClick() {
                this.playBeep(520, 'sine', 0.08, 0.08);
            }

            playSuccess() {
                if (!this.enabled) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playBeep(freq, 'triangle', 0.25, 0.12);
                    }, idx * 100);
                });
            }

            playFanfare() {
                if (!this.enabled) return;
                this.init();
                const notes = [392, 523.25, 659.25, 783.99, 880, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playBeep(freq, 'square', 0.35, 0.1);
                    }, idx * 130);
                });
            }

            playFlashlight() {
                this.playBeep(200, 'sawtooth', 0.05, 0.05);
            }
        }

        const audio = new SoundEngine();

        /**
         * Global Game State
         */
        const GameData = {
            currentStage: 'CHAPTER1_ROOM',
            inventory: [],
            journal: [
                { id: 'nam_san_tower', title: 'N서울타워', icon: '🗼', desc: '서울 용산구 남산 꼭대기에 위치한 대표적 전망 타워. 높이 236.7m.', collected: true },
                { id: 'yongsan_apartment', title: '용산 21층 아파트', icon: '🏢', desc: '시우가 살고 있는 아파트. 창밖으로 남산타워가 한눈에 보인다.', collected: true },
                { id: 'game_console', title: '침대 밑 게임기', icon: '🎮', desc: '시우가 아끼는 게임기. 침대 밑 어둠 속에서 발견했다.', collected: false },
                { id: 'leather_box', title: '낡은 가죽 상자', icon: '🧰', desc: '침대 밑 구석 먼지 속에서 찾아낸 비밀스러운 상자.', collected: false },
                { id: 'secret_map', title: '빛바랜 지도 조각', icon: '📜', desc: 'N서울타워 전망대 꼭대기로 유도하는 암호 메모가 적혀있다.', collected: false },
                { id: 'green_backpack', title: '초록색 탐험 배낭', icon: '🎒', desc: '태극기 패치가 붙어있는 시우의 씩씩한 모험 배낭.', collected: false },
                { id: 'cable_car_ticket', title: '남산 케이블카 티켓', icon: '🚡', desc: '바람을 가르고 남산을 오르는 케이블카 탑승권.', collected: false },
                { id: 'golden_ticket', title: '전 세계 평생 무료 여행 티켓', icon: '🎫', desc: 'N서울타워 전망대 구석 나무 상자에서 발견한 진짜 보물!', collected: false }
            ],
            chapterStatus: {
                ch1_flashlight_done: false,
                ch1_puzzle_done: false,
                ch2_packing_done: false,
                ch2_cablecar_done: false,
                ch3_box_unlocked: false
            }
        };

        // UI Helpers
        function showModal(title, contentHtml) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-body').innerHTML = contentHtml;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function setDialogue(speaker, text, avatar = '👦') {
            document.getElementById('dialogue-speaker').innerText = speaker;
            document.getElementById('dialogue-text').innerText = text;
            document.getElementById('dialogue-avatar').innerText = avatar;
        }

        function setFooterNextButton(show, onClickFn = null) {
            const btn = document.getElementById('btn-next-step');
            if (show) {
                btn.classList.remove('hidden');
                btn.onclick = () => {
                    audio.playClick();
                    if (onClickFn) onClickFn();
                };
            } else {
                btn.classList.add('hidden');
            }
        }

        function markJournalCollected(itemId) {
            const item = GameData.journal.find(j => j.id === itemId);
            if (item && !item.collected) {
                item.collected = true;
                const badge = document.getElementById('journal-badge');
                badge.innerText = GameData.journal.filter(j => j.collected).length;
                badge.classList.remove('hidden');
            }
        }

        /**
         * SCREEN 0: Main Menu / Title Screen
         */
        function renderMainMenu() {
            document.getElementById('stage-title').innerText = "남산타워 보물찾기";
            document.getElementById('stage-subtitle').innerText = "꼬마 탐험가의 시작";
            
            const container = document.getElementById('screen-container');
            container.innerHTML = `
                <div class="w-full h-full flex flex-col items-center justify-between p-6 bg-gradient-to-b from-sky-200 via-amber-100 to-amber-200 relative overflow-hidden">
                    <!-- Background Illustration Elements -->
                    <div class="absolute top-4 right-10 text-6xl opacity-30 floating">☁️</div>
                    <div class="absolute top-16 left-12 text-5xl opacity-30 floating" style="animation-delay: 1.5s;">☁️</div>
                    <div class="absolute bottom-20 right-1/4 text-8xl opacity-80 pointer-events-none">🗼</div>
                    <div class="absolute bottom-16 left-10 text-6xl opacity-70 pointer-events-none">🏢</div>

                    <!-- Title Header -->
                    <div class="text-center z-10 mt-6">
                        <div class="inline-block px-4 py-1.5 bg-amber-800 text-amber-100 rounded-full font-bold text-xs sm:text-sm mb-3 shadow">
                            동화 어드벤처 & 숨은그림찾기 퍼즐
                        </div>
                        <h1 class="text-3xl sm:text-5xl font-extrabold text-amber-950 font-gaegu tracking-wider drop-shadow-md">
                            남산타워 보물찾기
                        </h1>
                        <p class="text-xs sm:text-base text-amber-900/80 mt-1 font-medium">
                            용산구 21층 아파트에서 시작하는 10살 시우의 특별한 모험
                        </p>
                    </div>

                    <!-- Hero Visual -->
                    <div class="z-10 my-4 flex flex-col items-center justify-center">
                        <div class="w-36 h-36 sm:w-44 sm:h-44 rounded-full bg-white/80 border-4 border-amber-500 shadow-xl flex items-center justify-center relative pulse-glow">
                            <span class="text-7xl sm:text-8xl">👦🎒</span>
                            <span class="absolute -bottom-2 -right-2 bg-amber-500 text-white rounded-full p-2 text-xl">✨</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="z-10 w-full max-w-xs flex flex-col gap-3 mb-4">
                        <button id="btn-start-game" class="w-full py-3.5 bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white font-extrabold rounded-2xl shadow-lg border-b-4 border-amber-800 text-base sm:text-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-play"></i>
                            <span>모험 시작하기</span>
                        </button>
                        <button id="btn-open-journal-main" class="w-full py-2.5 bg-white/90 hover:bg-white text-amber-900 font-bold rounded-2xl shadow border border-amber-300 text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-book-bookmark text-amber-600"></i>
                            <span>탐험가 일지 (도감)</span>
                        </button>
                    </div>

            setDialogue("안내", "게임의 [모험 시작하기] 버튼을 누르면 10살 시우의 침대 밑 보물찾기가 시작됩니다!");
            setFooterNextButton(false);

            document.getElementById('btn-start-game').onclick = () => {
                audio.playClick();
                renderChapter1Room();
            };
            document.getElementById('btn-open-journal-main').onclick = () => {
                audio.playClick();
                openJournalModal();
            };
        }

        /**
         * SCREEN 1: Chapter 1 - Siwoo's Room (Introduction)
         */
        function renderChapter1Room() {
            GameData.currentStage = 'CHAPTER1_ROOM';
            document.getElementById('stage-title').innerText = "Chapter 1: 시우의 방 (21층)";
            document.getElementById('stage-subtitle').innerText = "실수로 굴러 들어간 게임기";

            const container = document.getElementById('screen-container');
            container.innerHTML = `
                <div class="w-full h-full flex flex-col items-center justify-between p-4 sm:p-6 bg-gradient-to-b from-sky-100 via-amber-50 to-orange-100 relative overflow-hidden">
                    <!-- Window View of Namsan Tower -->
                    <div class="w-full max-w-2xl bg-sky-200 border-4 border-amber-800/60 rounded-3xl p-4 shadow-inner relative overflow-hidden flex flex-col items-center justify-center h-52 sm:h-64">

                        </div>

                            <span class="text-xs font-bold text-amber-900">책상 위 세계지도</span>
                            <span class="text-[11px] text-slate-500">모험가의 꿈을 키우는 곳</span>
                        </div>

                            <span class="text-4xl mb-1">🛏️</span>
                            <span class="text-xs font-bold text-amber-950">침대 밑 어둠 속 탐색</span>
                            <span class="text-[11px] text-amber-700 font-bold">게임기와 상자가 떨어진 곳!</span>
                        </div>
                    </div>
                </div>
            `;

            setDialogue("시우", "앗! 주말에 신나게 게임을 하다가 실수로 게임기를 놓쳤어요! 데굴데굴 침대 밑 어두운 구석으로 들어가 버렸어요.");
            setFooterNextButton(true, () => {

            document.getElementById('window-tower').onclick = () => {

            };

            document.getElementById('card-desk').onclick = () => {
                audio.playClick();
                showModal("시우의 책상", "<p class='text-center text-base'>시우는 교과서 대신 큰 세계 지도를 펼쳐놓고 전 세계를 누비는 상상을 하곤 했어요! 🗺️</p>");
            };

            document.getElementById('card-bed').onclick = () => {
                audio.playClick();
                renderChapter1Flashlight();
            };
        }

        /**
         * SCREEN 2: Chapter 1 - Under Bed Flashlight Canvas Minigame
         */
        function renderChapter1Flashlight() {
            GameData.currentStage = 'CHAPTER1_FLASHLIGHT';
            document.getElementById('stage-title').innerText = "Chapter 1: 침대 밑 탐색";
            document.getElementById('stage-subtitle').innerText = "손전등 불빛으로 어둠 속을 비춰보세요";

            const container = document.getElementById('screen-container');
            container.innerHTML = `
                <div class="relative w-full h-full bg-slate-950 flex flex-col items-center justify-center overflow-hidden">
                    <!-- Instruction Overlay -->
                    <div class="absolute top-3 left-1/2 -translate-x-1/2 bg-amber-900/80 text-amber-100 text-xs sm:text-sm px-4 py-1.5 rounded-full z-20 shadow border border-amber-500/30 flex items-center gap-2">
                        <span>🔦 마우스/손가락을 움직여 침대 밑 [게임기]와 [가죽 상자]를 찾으세요!</span>
                    </div>

                    <!-- Canvas Stage -->
                    <canvas id="flashlight-canvas" class="w-full h-full cursor-crosshair z-10"></canvas>

                    <!-- Found Items Counter -->

                        <span id="found-console" class="opacity-40">🎮 게임기 (미발견)</span>
                        <span id="found-box" class="opacity-40">🧰 가죽상자 (미발견)</span>
                    </div>
                </div>
            `;

            setDialogue("시우", "방바닥에 납작 엎드려 손전등 빛을 조심스럽게 비추고 있어요. 어디에 들어갔을까?");

            const canvas = document.getElementById('flashlight-canvas');
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
            resizeCanvas();

            let pointer = { x: canvas.width / 2, y: canvas.height / 2 };
            
            // Hidden items coords
            const items = [
                { id: 'console', name: '게임기', icon: '🎮', x: canvas.width * 0.25, y: canvas.height * 0.65, r: 35, found: false },
                { id: 'box', name: '가죽 상자', icon: '🧰', x: canvas.width * 0.75, y: canvas.height * 0.45, r: 40, found: false },
                { id: 'train', name: '장난감 기차', icon: '🚂', x: canvas.width * 0.5, y: canvas.height * 0.3, r: 30, dummy: true },
                { id: 'dust', name: '먼지 뭉치', icon: '🧹', x: canvas.width * 0.15, y: canvas.height * 0.25, r: 25, dummy: true }
            ];

            function updatePointer(e) {
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches[0]) {
                    pointer.x = e.touches[0].clientX - rect.left;
                    pointer.y = e.touches[0].clientY - rect.top;
                } else {
                    pointer.x = e.clientX - rect.left;
                    pointer.y = e.clientY - rect.top;
                }
            }

            canvas.addEventListener('mousemove', updatePointer);
            canvas.addEventListener('touchmove', updatePointer);
            canvas.addEventListener('touchstart', updatePointer);

            let animId;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Dark Background with floor pattern
                ctx.fillStyle = '#0c0a09';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Floor planks dimly
                ctx.strokeStyle = '#1c1917';
                ctx.lineWidth = 2;
                for(let y=0; y<canvas.height; y+=40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }

                // Draw hidden items
                items.forEach(item => {
                    ctx.font = '36px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(item.icon, item.x, item.y);

                    // Check flashlight distance
                    const dist = Math.hypot(pointer.x - item.x, pointer.y - item.y);
                    if (dist < 80 && !item.found) {
                        if (item.id === 'console') {
                            item.found = true;
                            document.getElementById('found-console').innerHTML = "🎮 게임기 획득!";
                            document.getElementById('found-console').classList.remove('opacity-40');
                            document.getElementById('found-console').classList.add('text-green-400', 'font-bold');
                            audio.playSuccess();
                            markJournalCollected('game_console');
                        } else if (item.id === 'box') {
                            item.found = true;
                            document.getElementById('found-box').innerHTML = "🧰 가죽 상자 발견!";
                            document.getElementById('found-box').classList.remove('opacity-40');
                            document.getElementById('found-box').classList.add('text-amber-400', 'font-bold');
                            audio.playSuccess();
                            markJournalCollected('leather_box');
                        }
                    }
                });

                // Flashlight Overlay
                ctx.save();
                ctx.fillStyle = 'rgba(5, 5, 10, 0.94)';
                ctx.beginPath();
                ctx.rect(0, 0, canvas.width, canvas.height);
                ctx.arc(pointer.x, pointer.y, 100, 0, Math.PI * 2, true);
                ctx.fill();

                // Flashlight Glow
                const grad = ctx.createRadialGradient(pointer.x, pointer.y, 10, pointer.x, pointer.y, 100);
                grad.addColorStop(0, 'rgba(254, 240, 138, 0.3)');
                grad.addColorStop(0.8, 'rgba(254, 240, 138, 0.05)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(pointer.x, pointer.y, 100, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Check Completion
                const consoleItem = items.find(i => i.id === 'console');
                const boxItem = items.find(i => i.id === 'box');
                if (consoleItem.found && boxItem.found) {
                    GameData.chapterStatus.ch1_flashlight_done = true;
                    setFooterNextButton(true, () => {
                        cancelAnimationFrame(animId);
                        renderChapter1Puzzle();
                    });
                    setDialogue("시우", "찾았다! 게임기 옆 구석에 먼지를 뒤집어쓴 낡은 가죽 상자가 있었어요! 한번 열어볼까요?");
                }

                animId = requestAnimationFrame(draw);
            }

            draw();
        }

         */
        function renderChapter2CableCar() {
            GameData.currentStage = 'CHAPTER2_CABLECAR';
            document.getElementById('stage-title').innerText = "Chapter 2: 남산 케이블카 탑승";
            document.getElementById('stage-subtitle').innerText = "케이블카를 자유롭게 조종해 보물 아이콘을 수집하세요!";

            const container = document.getElementById('screen-container');
            container.innerHTML = `
                <div class="relative w-full h-full bg-gradient-to-b from-sky-300 via-sky-200 to-amber-100 flex flex-col items-center justify-between overflow-hidden">
                    <!-- HUD -->
                    <div class="absolute top-3 left-4 right-4 flex justify-between items-center z-20">
                        <div class="bg-amber-900/80 text-amber-100 text-xs px-3 py-1.5 rounded-full shadow border border-amber-500/30 font-bold">
                            🚡 상하좌우(터치/마우스/방향키)로 케이블카를 조종하세요!
                        </div>
                        <div id="cable-score" class="bg-amber-500 text-amber-950 font-black text-xs sm:text-sm px-3 py-1.5 rounded-full shadow">
                            수집: 0 / 5
                        </div>
                    </div>

                    <canvas id="cablecar-canvas" class="w-full h-full z-10 cursor-move"></canvas>
                </div>
            `;

            setDialogue("시우", "와! 남산 케이블카를 상하좌우로 직접 조종하고 있어요! 바람을 가르며 아이콘을 수집해보세요!");

            const canvas = document.getElementById('cablecar-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
            resize();

            let carX = canvas.width / 2;
            let carY = canvas.height * 0.5;
            let score = 0;
            const targetScore = 5;

            // Collectible items scattered across canvas (different X, Y positions)
            const stars = [
                { x: canvas.width * 0.25, y: canvas.height * 0.25, icon: '⭐', collected: false },
                { x: canvas.width * 0.75, y: canvas.height * 0.35, icon: '🕊️', collected: false },
                { x: canvas.width * 0.35, y: canvas.height * 0.55, icon: '⭐', collected: false },
                { x: canvas.width * 0.8, y: canvas.height * 0.7, icon: '📸', collected: false },
                { x: canvas.width * 0.2, y: canvas.height * 0.8, icon: '⭐', collected: false }
            ];

            // Touch / Mouse position tracker (supports full 2D movement)
            function handleMove(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                carX = clientX - rect.left;
                carY = clientY - rect.top;
                carX = Math.max(40, Math.min(canvas.width - 40, carX));
                carY = Math.max(40, Math.min(canvas.height - 40, carY));
            }

            canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
            canvas.addEventListener('touchmove', e => {
                if (e.touches && e.touches[0]) {
                    handleMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            });

            // Keyboard Controls
            const keys = {};
            const keyHandlerDown = e => { keys[e.key] = true; };
            const keyHandlerUp = e => { keys[e.key] = false; };
            window.addEventListener('keydown', keyHandlerDown);
            window.addEventListener('keyup', keyHandlerUp);

            let animId;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Process keyboard movement
                const speed = 4;
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) carX -= speed;
                if (keys['ArrowRight'] || keys['d'] || keys['D']) carX += speed;
                if (keys['ArrowUp'] || keys['w'] || keys['W']) carY -= speed;
                if (keys['ArrowDown'] || keys['s'] || keys['S']) carY += speed;

                carX = Math.max(40, Math.min(canvas.width - 40, carX));
                carY = Math.max(40, Math.min(canvas.height - 40, carY));

                // Cable Lines
                ctx.strokeStyle = 'rgba(120, 53, 15, 0.4)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height * 0.2);
                ctx.lineTo(canvas.width, canvas.height * 0.2);
                ctx.moveTo(0, canvas.height * 0.8);
                ctx.lineTo(canvas.width, canvas.height * 0.8);
                ctx.stroke();

                // Draw Namsan Tower in background top right
                ctx.font = '70px sans-serif';
                ctx.fillText('🗼', canvas.width * 0.82, 80);

                // Draw Collectibles
                stars.forEach(s => {
                    if (!s.collected) {
                        ctx.font = '28px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(s.icon, s.x, s.y);

                        // Check 2D Collision with Cable Car
                        const dist = Math.hypot(carX - s.x, carY - s.y);
                        if (dist < 40) {
                            s.collected = true;
                            score++;
                            audio.playSuccess();
                            document.getElementById('cable-score').innerText = `수집: ${score} / ${targetScore}`;
                        }
                    }
                });

                // Draw Cable Hanging Rod connecting to line
                ctx.strokeStyle = '#451a03';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(carX, carY - 20);
                ctx.lineTo(carX, Math.max(0, carY - 45));
                ctx.stroke();

                // Cable Car Body
                ctx.font = '48px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚡', carX, carY);

                if (score >= targetScore) {
                    GameData.chapterStatus.ch2_cablecar_done = true;
                    window.removeEventListener('keydown', keyHandlerDown);
                    window.removeEventListener('keyup', keyHandlerUp);
                    setFooterNextButton(true, () => {
                        cancelAnimationFrame(animId);
                        renderChapter3Observatory();
                    });
                    setDialogue("시우", "N서울타워 전망대 입구에 무사히 도착했어요! 이제 지도의 힌트를 따라 전망대 구석진 곳을 탐색해볼까요?");
                } else {
                    animId = requestAnimationFrame(draw);
                }
            }

            draw();
        }

        /**
         * SCREEN 7: Chapter 3 - Box Dial Lock Puzzle (N - 10 - W)
         */
        function renderChapter3BoxPuzzle() {
            GameData.currentStage = 'CHAPTER3_BOX_PUZZLE';
            document.getElementById('stage-title').innerText = "Chapter 3: 자물쇠 암호 해독";
            document.getElementById('stage-subtitle').innerText = "지도 힌트 (N - 10 - W)에 맞춰 나침반 바늘을 맞추세요";

            const container = document.getElementById('screen-container');
            container.innerHTML = `
                <div class="w-full h-full flex flex-col items-center justify-center p-4 bg-slate-900/40 relative">
                    <div class="w-full max-w-md bg-amber-950 border-4 border-amber-600 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center text-amber-100">
                        
                        <div class="text-5xl mb-2">🔒</div>
                        <h2 class="text-xl font-black text-amber-300 font-gaegu mb-1">고풍스러운 나무 상자 자물쇠</h2>
                        <p class="text-xs text-amber-200/70 mb-4">비밀 메모 힌트: N (북쪽) - 10 (시우 나이) - W (서쪽)</p>

                        <!-- Dial Wheels -->
                        <div class="grid grid-cols-3 gap-3 w-full my-3">
                            <!-- Dial 1: Direction 1 -->
                            <div class="bg-amber-900 border-2 border-amber-500 rounded-2xl p-3 flex flex-col items-center">
                                <span class="text-[10px] text-amber-300 font-bold mb-1">방위 1</span>
                                <button id="dial1" class="text-2xl font-black bg-amber-950 text-amber-200 w-12 h-12 rounded-xl flex items-center justify-center border border-amber-600 hover:bg-amber-800 transition">
                                    S
                                </button>
                            </div>

                            <!-- Dial 2: Number -->
                            <div class="bg-amber-900 border-2 border-amber-500 rounded-2xl p-3 flex flex-col items-center">
                                <span class="text-[10px] text-amber-300 font-bold mb-1">숫자</span>
                                <button id="dial2" class="text-2xl font-black bg-amber-950 text-amber-200 w-12 h-12 rounded-xl flex items-center justify-center border border-amber-600 hover:bg-amber-800 transition">
                                    5
                                </button>
                            </div>

                            <!-- Dial 3: Direction 2 -->
                            <div class="bg-amber-900 border-2 border-amber-500 rounded-2xl p-3 flex flex-col items-center">
                                <span class="text-[10px] text-amber-300 font-bold mb-1">방위 2</span>
                                <button id="dial3" class="text-2xl font-black bg-amber-950 text-amber-200 w-12 h-12 rounded-xl flex items-center justify-center border border-amber-600 hover:bg-amber-800 transition">
                                    E
                                </button>
                            </div>
                        </div>

                        <button id="btn-check-lock" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-amber-950 font-black rounded-xl shadow mt-2 transition">
                            자물쇠 열기 🔑
                        </button>
                    </div>
                </div>
            `;

            setDialogue("시우", "자물쇠 바늘을 클릭해서 지도에 있었던 'N - 10 - W' 암호에 맞춰보세요!");

            const dirs = ['N', 'E', 'S', 'W'];
            let idx1 = 2; // Starts at S
            let val2 = 5; // Starts at 5
            let idx3 = 1; // Starts at E

            const d1 = document.getElementById('dial1');
            const d2 = document.getElementById('dial2');
            const d3 = document.getElementById('dial3');

            d1.onclick = () => {
                audio.playClick();
                idx1 = (idx1 + 1) % dirs.length;
                d1.innerText = dirs[idx1];
            };

            d2.onclick = () => {
                audio.playClick();
                val2 = (val2 % 12) + 1;
                d2.innerText = val2;
            };

            d3.onclick = () => {
                audio.playClick();
                idx3 = (idx3 + 1) % dirs.length;
                d3.innerText = dirs[idx3];
            };

            document.getElementById('btn-check-lock').onclick = () => {
                if (dirs[idx1] === 'N' && val2 === 10 && dirs[idx3] === 'W') {
                    audio.playFanfare();
                    GameData.chapterStatus.ch3_box_unlocked = true;
                    showModal("상자가 열렸습니다! ✨", "<div class='text-center py-4'><span class='text-6xl floating inline-block mb-2'>🎫✨</span><p class='text-lg font-bold text-amber-950'>탁 소리와 함께 상자 뚜껑이 열리며 눈부신 금빛 조각이 빛납니다!</p></div>");
                    setTimeout(() => {
                        closeModal();
                        renderChapter4Ending();
                    }, 2200);
                } else {
                    audio.playBeep(200, 'sawtooth', 0.2, 0.1);
                    showModal("암호가 맞지 않습니다", "<p class='text-center'>힌트를 다시 확인해보세요!<br><b>[ N (북) - 10 - W (서) ]</b></p>");
                }
            };
        }

        /**
         * SCREEN 8: Chapter 4 - Grand Ending & Ticket Reveal
         */
        function renderChapter4Ending() {
            GameData.currentStage = 'CHAPTER4_ENDING';
            document.getElementById('stage-title').innerText = "Chapter 4: 넓은 세상으로!";
            document.getElementById('stage-subtitle').innerText = "보물 획득 & 엔딩";

            const container = document.getElementById('screen-container');
            container.innerHTML = `
                <div class="w-full h-full flex flex-col items-center justify-between p-4 bg-gradient-to-b from-amber-200 via-amber-100 to-sky-200 relative overflow-hidden">
                    
                    <!-- Grand Shimmering Golden Ticket -->
                    <div class="w-full max-w-lg golden-shimmer rounded-3xl p-6 border-4 border-amber-300 shadow-2xl flex flex-col items-center text-center text-amber-950 my-auto floating">
                        <div class="text-xs font-extrabold bg-white/80 px-3 py-1 rounded-full mb-2">🏆 진짜 보물 발견!</div>
                        
                        <div class="text-6xl my-2">🎫</div>
                        <h1 class="text-2xl sm:text-3xl font-black tracking-tight font-gaegu mb-2 text-amber-950">
                            [ 전 세계 평생 무료 여행 티켓 ]
                        </h1>

                        <div class="bg-white/80 p-4 rounded-2xl border border-amber-400 text-xs sm:text-sm font-medium leading-relaxed my-2 text-amber-900">
                            "창문 너머를 바라보기만 하던 아이에서 직접 발로 뛰어 찾아낸 진짜 탐험가가 되었구나.<br><b>이제 넓은 세상으로 마음껏 뛰어들어라!</b>"
                        </div>

                        <div class="text-[11px] font-bold text-amber-800 mt-1">
                            발급 대상: 10세 꼬마 탐험가 시우 👦
                        </div>
                    </div>

                    <!-- World Map DLC Preview Trigger -->
                    <div class="w-full max-w-md bg-white/80 rounded-2xl p-3 border border-amber-300 flex items-center justify-between z-10">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">🌍</span>
                            <div class="text-left">
                                <div class="text-xs font-bold text-amber-950">다음 모험지 해금 (DLC Preview)</div>
                                <div class="text-[10px] text-slate-500">파리 에펠탑, 이집트 피라미드</div>
                            </div>
                        </div>
                        <button id="btn-world-map" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs rounded-xl shadow">
                            세계 지도 보기
                        </button>
                    </div>
                </div>
            `;

            markJournalCollected('golden_ticket');
            setDialogue("시우", "찾았다! 손에 쥔 금빛 티켓을 가슴에 꼭 품었어요. 침대 밑에서 시작된 모험이 나에게 세계 여행을 선물해주었어요!", "👦✨");
            setFooterNextButton(true, () => {
                renderMainMenu();
            });

            document.getElementById('btn-world-map').onclick = () => {
                audio.playClick();
                showModal("🌍 후속 에피소드: 전 세계 모험", `
                    <div class="space-y-3 py-2 text-center">
                        <div class="p-3 bg-amber-100 rounded-xl border border-amber-300">
                            <span class="text-3xl">🗼🇫🇷</span>
                            <div class="font-bold text-sm text-amber-950">DLC 1: 프랑스 파리 에펠탑 보물찾기</div>
                        </div>
                        <div class="p-3 bg-amber-100 rounded-xl border border-amber-300">
                            <span class="text-3xl">🐪🇪🇬</span>
                            <div class="font-bold text-sm text-amber-950">DLC 2: 이집트 피라미드 보물찾기</div>
                        </div>
                        <div class="p-3 bg-amber-100 rounded-xl border border-amber-300">
                            <span class="text-3xl">🗽🇺🇸</span>
                            <div class="font-bold text-sm text-amber-950">DLC 3: 뉴욕 자유의 여신상 보물찾기</div>
                        </div>
                    </div>
                `);
            };
        }

        /**
         * Modal Logic for Explorer's Journal & Hints
         */
        function openJournalModal() {
            const itemsHtml = GameData.journal.map(item => `
                <div class="flex items-center gap-3 p-3 rounded-2xl border ${item.collected ? 'bg-amber-100/80 border-amber-300' : 'bg-slate-100 border-slate-200 opacity-50'} mb-2">
                    <span class="text-3xl">${item.collected ? item.icon : '❓'}</span>
                    <div class="flex-1">
                        <div class="font-bold text-xs sm:text-sm text-amber-950">${item.collected ? item.title : '미발견 항목'}</div>
                        <div class="text-[11px] text-slate-600 leading-snug">${item.collected ? item.desc : '모험을 진행하며 도감을 채워보세요.'}</div>
                    </div>
                </div>
            `).join('');

            showModal("📖 탐험가 일지 (도감)", itemsHtml);
        }

        function openHintModal() {
            let hintMsg = "";
            switch (GameData.currentStage) {
                case 'CHAPTER1_ROOM':
                    hintMsg = "침대 밑 탐색 버튼(🛏️)을 눌러 어두운 구석으로 들어가보세요!";
                    break;
                case 'CHAPTER1_FLASHLIGHT':
                    hintMsg = "마우스나 손가락을 손전등처럼 움직여 [게임기]와 [가죽 상자]를 찾아보세요.";
                    break;
                case 'CHAPTER1_PUZZLE':
                    hintMsg = "가죽 상자 속 빛바랜 지도 메시지를 읽고 다음 버튼을 누르세요.";
                    break;
                case 'CHAPTER2_PACKING':
                    hintMsg = "책상 주변에 있는 지갑, 물, 지도, 나침반 4가지를 모두 클릭하세요.";
                    break;
                case 'CHAPTER2_CABLECAR':
                    hintMsg = "상하좌우(터치/마우스/방향키)로 케이블카를 이동시켜 수집품 5개를 모두 모으세요!";
                    break;
                case 'CHAPTER3_OBSERVATORY':
                    hintMsg = "전망대 화면 아래쪽의 [고풍스러운 나무 상자]를 클릭하세요.";
                    break;
                case 'CHAPTER3_BOX_PUZZLE':
                    hintMsg = "자물쇠 암호는 지도 메시지에 있었던 [ N - 10 - W ] 입니다!";
                    break;
                default:
                    hintMsg = "시우와 함께 모험을 계속 진행해 보세요!";
            }
            showModal("💡 탐험가 힌트", `<div class="p-4 bg-yellow-50 rounded-2xl border border-yellow-300 text-center text-sm font-bold text-amber-900">${hintMsg}</div>`);
        }

        window.onload = function() {
            // Attach Header Event Handlers
            document.getElementById('btn-home').onclick = () => {
                audio.playClick();
                renderMainMenu();
            };

            document.getElementById('btn-journal').onclick = () => {
                audio.playClick();
                openJournalModal();
            };

            document.getElementById('btn-hint').onclick = () => {
                audio.playClick();
                openHintModal();
            };

            document.getElementById('btn-close-modal').onclick = closeModal;
            document.getElementById('btn-modal-ok').onclick = closeModal;

            document.getElementById('btn-sound').onclick = () => {
                audio.enabled = !audio.enabled;
                document.getElementById('sound-icon').className = audio.enabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark text-red-400";
            };

            // Start Main Menu
            renderMainMenu();
        };
    </script>
</body>
</html>
